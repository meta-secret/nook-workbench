  items:
  - First format bake rebuilt the whole Rust dependency graph after workspace member
    path nesting; that cold cook was expected for the layout change.
  - Three PR validation retriggers came from rustfmt on lengthened path strings and
    one missed dynamic format!("nook-app/{consumer}") path in preflight.
  - Mechanical path rewrites should include rustfmt on preflight before the first
    push when path strings grow past line length.
