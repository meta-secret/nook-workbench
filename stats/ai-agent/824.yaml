waste_assessment:
  wasteful: true
  findings:
    - One attempted single-test grep was not forwarded correctly by the repository task wrapper and spent 16 seconds without selecting a test.
    - The full focused Playwright spec proved the new regression passed but also exposed an unrelated existing encrypted-provider fixture failure; it was not rerun unchanged.
    - Each GitHub Actions run followed a base update or source/test change; no unchanged workflow rerun was requested.
    - Pull-request jobs correctly used direct compilation because untrusted workflows receive no persistent cache credentials.
    - Base coverage fallbacks cannot safely reuse artifacts produced by untrusted pull-request code.
