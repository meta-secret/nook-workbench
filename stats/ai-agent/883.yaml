waste:
  - kind: flaky_e2e_setup
    note: Multiple extension e2e iterations for unlock-without-grant and closed popup reuse before the local-vault re-approve path stabilized.
  - kind: shallow_worktree
    note: Unshallow fetch was required before merging origin/main into the PR branch.
lessons:
  - Extension popups close when Connect opens Simple Vault; e2e must open a fresh extension page per pairing attempt.
  - Re-approve after clearing the grant needs a website-local passkey vault; extension-identity vaults cannot unlock without the grant.
  - Do not refuse all signer minting when events exist; that breaks enrollment while quarantine refusal already blocks unauthorized JoinApproved.
