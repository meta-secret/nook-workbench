waste_assessment:
  wasteful: true
  findings:
    - The first pushed workflow contradicted the repository preflight contract and required a corrective head push.
    - One remaining authoritative workflow guide required another documentation-only head push.
    - Full browser E2E reproduced existing Main vault-flow failures twice; the second run established determinism before the label was removed.
    - A canceled workflow's successful native producer was not reusable, causing the final normal run to repeat cold Native validation.
    - Verify and preview itself consistently completed in approximately three and a half minutes after the topology change.
  required_actions:
    - Repair the existing Main Web and extension E2E failures under the active Main-failure record.
    - Evaluate source-keyed native handoff reuse after a workflow is canceled without weakening exact-source validation.
