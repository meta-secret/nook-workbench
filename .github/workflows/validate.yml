name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - name: Enforce immutable records and baseline
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed="$(
            git diff --name-status "$base_sha" HEAD -- \
              'plans/**/*.md' \
              ':(exclude)plans/README.md' \
              ':(exclude)plans/_templates/**' \
              'scripts/legacy-validation-baseline.json'
          )"
          while IFS=$'\t' read -r status path _rest; do
            [ -z "$status" ] && continue
            if [ "$status" != "A" ]; then
              if [ "$path" = "scripts/legacy-validation-baseline.json" ]; then
                echo "::error file=${path}::The historical validation baseline is immutable."
              else
                echo "::error file=${path}::Published task plans are immutable; add a superseding plan instead."
              fi
              exit 1
            fi
          done <<< "$changed"
      - name: Enforce immutable focused-issue identity
        run: |
          set -euo pipefail
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          git diff --name-status "$base_sha" HEAD -- 'issues/**/*.md' |
            while IFS=$'\t' read -r status first_path second_path; do
              case "$status" in
                M) before_path="$first_path"; after_path="$first_path" ;;
                R*) before_path="$first_path"; after_path="$second_path" ;;
                *) continue ;;
              esac
              case "$after_path" in
                */README.md|issues/_templates/*) continue ;;
              esac
              before_gizmo="$(git show "$base_sha:$before_path" | sed -n 's/^gizmo_id:[[:space:]]*//p' | head -n 1)"
              after_gizmo="$(sed -n 's/^gizmo_id:[[:space:]]*//p' "$after_path" | head -n 1)"
              before_branch="$(git show "$base_sha:$before_path" | sed -n 's/^stack_branch:[[:space:]]*//p' | head -n 1)"
              after_branch="$(sed -n 's/^stack_branch:[[:space:]]*//p' "$after_path" | head -n 1)"
              before_predecessor="$(git show "$base_sha:$before_path" | sed -n 's/^stack_predecessor_branch:[[:space:]]*//p' | head -n 1)"
              after_predecessor="$(sed -n 's/^stack_predecessor_branch:[[:space:]]*//p' "$after_path" | head -n 1)"
              if ! bun scripts/focused-issue-transition.mjs \
                "$before_gizmo" "$after_gizmo" \
                "$before_branch" "$after_branch" \
                "$before_predecessor" "$after_predecessor"; then
                echo "::error file=${after_path}::focused-issue identity fields are immutable once recorded."
                exit 1
              fi
            done
      - name: Reject sensitive content
        run: |
          bun test scripts/scan-sensitive.test.mjs scripts/validate-records.test.mjs
          bun scripts/scan-sensitive.mjs
      - run: bun scripts/validate.mjs
      - name: Validate changed statistics
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- 'stats/**/*.yaml')
          ruby scripts/validate-stats.rb "${files[@]}"
