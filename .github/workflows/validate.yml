name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - name: Reject sensitive content
        run: |
          bun test scripts/scan-sensitive.test.mjs
          bun scripts/scan-sensitive.mjs
      - run: bun scripts/validate.mjs
      - name: Validate changed statistics
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- 'stats/**/*.yaml')
          ruby scripts/validate-stats.rb "${files[@]}"
